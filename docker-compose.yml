services:
  postgresdb:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - ./.env
    ports:
      - "8080:5432"
  backend:
    build: ./backend
    container_name: backend_node
    depends_on:
      - postgresdb
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
